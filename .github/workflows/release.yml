# Release: on a v* tag, build and publish all distribution artifacts.
#
# Required repository secrets (add under Settings -> Secrets and variables -> Actions):
#   HOMEBREW_TAP_GITHUB_TOKEN   PAT with `repo` scope on sns45/homebrew-tap (Homebrew formula push).
#   SCOOP_GITHUB_TOKEN          PAT with `repo` scope on sns45/scoop-bucket  (optional; Windows Scoop).
#   NPM_TOKEN                   npm automation token (optional; publishes @sns45/assayward).
# GITHUB_TOKEN is provided automatically (GitHub Releases + GHCR image push).
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the container image to GHCR
  id-token: write   # keyless signing of release artifacts (future)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: goreleaser release (binaries, Homebrew, Scoop, nfpm, Docker)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}

  wasm:
    runs-on: ubuntu-latest
    needs: goreleaser   # the release must exist before we can upload to it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build wasm artifacts (wasip1 + js + loader)
        run: make wasm
      - name: Attach wasm artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/assayward.wasm dist/assayward_js.wasm dist/wasm_exec.js --clobber

  npm:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Build wasm + bundle into the npm package
        run: |
          make wasm
          mkdir -p surfaces/npm/dist
          cp dist/assayward_js.wasm dist/wasm_exec.js surfaces/npm/dist/
      - name: Publish @sns45/assayward (skipped if NPM_TOKEN is unset)
        working-directory: surfaces/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN not configured; skipping npm publish."
            exit 0
          fi
          bun install
          npm publish --access public
