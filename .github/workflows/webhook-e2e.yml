# Live-cluster e2e for the admission webhook: spins up a kind cluster, installs the
# webhook via Helm (self-signed TLS, no cert-manager needed), and asserts the real
# apiserver -> webhook -> decision path: enforce DENIES an unattested pod; audit ADMITS it.
name: webhook-e2e
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'surfaces/k8s-webhook/**'
      - 'deploy/helm/**'
      - 'pkg/core/**'
      - '.github/workflows/webhook-e2e.yml'

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build webhook image
        run: docker build -f surfaces/k8s-webhook/Dockerfile -t assayward-webhook:e2e .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: assayward-e2e

      - name: Load image into kind
        run: kind load docker-image assayward-webhook:e2e --name assayward-e2e

      - uses: azure/setup-helm@v4

      - name: Install webhook (enforce mode, self-signed TLS)
        run: |
          set -euxo pipefail
          kubectl create namespace assayward-system
          helm install aw deploy/helm/assayward-webhook -n assayward-system \
            --set image.repository=assayward-webhook \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set mode=enforce \
            --set policy.builtin=slsa-l3 \
            --set tls.mode=helm \
            --wait --timeout 150s
          kubectl -n assayward-system get deploy,svc,validatingwebhookconfiguration
          kubectl -n assayward-system rollout status deploy --timeout=120s

      - name: ENFORCE — an unattested pod must be DENIED by the webhook
        run: |
          set -uxo pipefail
          kubectl create namespace workloads
          # server-side dry-run routes through validating webhooks without creating the pod
          set +e
          OUT=$(kubectl -n workloads run probe-deny --image=nginx:1.27 --restart=Never --dry-run=server 2>&1)
          RC=$?
          set -e
          echo "webhook response:"; echo "$OUT"
          if [ "$RC" -eq 0 ]; then echo "FAIL: expected the webhook to DENY, but it admitted"; exit 1; fi
          echo "$OUT" | grep -iqE "assayward|denied|polic|signature|identity" || { echo "FAIL: denial did not come from assayward"; exit 1; }
          echo "ENFORCE DENY OK"

      - name: AUDIT — the same pod must be ADMITTED (with a warning)
        run: |
          set -euxo pipefail
          helm upgrade aw deploy/helm/assayward-webhook -n assayward-system --reuse-values \
            --set mode=audit --wait --timeout 150s
          kubectl -n assayward-system rollout status deploy --timeout=120s
          # audit mode always admits; server dry-run should succeed now
          kubectl -n workloads run probe-audit --image=nginx:1.27 --restart=Never --dry-run=server
          echo "AUDIT ADMIT OK"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n assayward-system get pods -o wide || true
          kubectl -n assayward-system describe deploy || true
          kubectl -n assayward-system logs deploy/aw-assayward-webhook --tail=100 || true
          kubectl get validatingwebhookconfiguration -o yaml || true
