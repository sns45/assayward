version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: assayward
    main: ./cmd/assayward
    binary: assayward
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    ids:
      - assayward
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  groups:
    - title: "New Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

# NOTE: `brews` is deprecated in goreleaser v2 but remains the only supported
# mechanism for publishing a Homebrew formula (as opposed to a Cask). The
# replacement `homebrew_casks` key targets Cask distribution, not formulas.
# Migrate to the formula-specific key once goreleaser exposes one.
brews:
  - name: assayward
    # Push the Homebrew formula only when a tap token is configured (set the
    # HOMEBREW_TAP_GITHUB_TOKEN secret). Without it the formula is still built
    # but not pushed, so the release succeeds.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    ids:
      - default
    repository:
      owner: sns45
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/sns45/assayward"
    description: "Evaluate supply-chain evidence against a declarative policy"
    license: "Apache-2.0"
    install: |
      bin.install "assayward"
    test: |
      system "#{bin}/assayward", "--version"

scoops:
  - name: assayward
    # Push the Scoop manifest only when SCOOP_GITHUB_TOKEN is configured.
    skip_upload: '{{ if .Env.SCOOP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    ids:
      - default
    repository:
      owner: sns45
      name: scoop-bucket
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
    homepage: "https://github.com/sns45/assayward"
    description: "Evaluate supply-chain evidence against a declarative policy"
    license: "Apache-2.0"

nfpms:
  - id: assayward-packages
    package_name: assayward
    ids:
      - assayward
    vendor: sns45
    maintainer: "sns45 <notifyshantanu@gmail.com>"
    description: "Evaluate supply-chain evidence (SLSA provenance, SBOMs, VEX) against a declarative policy and produce allow/audit/deny decisions."
    homepage: "https://github.com/sns45/assayward"
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    priority: optional

# Single-arch (linux/amd64) image to GHCR. The legacy builder stages the binary
# into the build context root so `COPY assayward` resolves. Multi-arch and image
# SBOM attestation (dockers_v2 + buildx container driver) are future refinements.
dockers:
  - id: assayward-docker
    ids:
      - assayward
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/sns45/assayward:{{ .Version }}"
      - "ghcr.io/sns45/assayward:latest"
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.source=https://github.com/sns45/assayward"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
