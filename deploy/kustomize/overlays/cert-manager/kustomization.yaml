apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherits all base resources from deploy/kustomize/base.
resources:
  - ../../base
  - issuer.yaml
  - certificate.yaml

# Strategic merge patch: adds the cert-manager.io/inject-ca-from annotation to
# the ValidatingWebhookConfiguration so cert-manager injects caBundle on every
# certificate renewal.
patches:
  - path: patch-webhook-ca-annotation.yaml
    target:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingWebhookConfiguration
      name: assayward-webhook
