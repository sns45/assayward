apiVersion: apps/v1
kind: Deployment
metadata:
  name: assayward-webhook
  namespace: assayward-system
  labels:
    app.kubernetes.io/name: assayward-webhook
    app.kubernetes.io/component: admission-webhook
    app.kubernetes.io/part-of: assayward
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: assayward-webhook
      app.kubernetes.io/component: admission-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assayward-webhook
        app.kubernetes.io/component: admission-webhook
        app.kubernetes.io/part-of: assayward
        app.kubernetes.io/version: "0.1.0"
    spec:
      serviceAccountName: assayward-webhook
      # Pod-level security context: run as non-root with a dedicated UID.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      volumes:
        # TLS certificate and key provisioned externally (cert-manager overlay or manual).
        # Secret name: assayward-webhook-tls
        # Keys expected: tls.crt and tls.key
        - name: tls
          secret:
            secretName: assayward-webhook-tls
        # Policy ConfigMap: policy.yaml is the default slsa-l3 policy.
        # Operators may replace the configmap data with a custom TrustPolicy.
        - name: config
          configMap:
            name: assayward-webhook-config
        # Ephemeral scratch dir required when readOnlyRootFilesystem=true.
        - name: tmp
          emptyDir: {}
      containers:
        - name: webhook
          image: ghcr.io/sns45/assayward-webhook:0.1.0
          imagePullPolicy: IfNotPresent
          # Container-level security context matches Helm chart values.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          args:
            # AUDIT-FIRST: the webhook admits all pods in audit mode and emits
            # Kubernetes Warning events for policy violations. After operators
            # observe clean Warning logs, flip --mode=enforce (and set
            # failurePolicy: Fail in the ValidatingWebhookConfiguration) to
            # enforce hard admission denials.
            - --addr=:8443
            - --mode=audit
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            # Default: use the embedded slsa-l3 policy from the ConfigMap.
            # To use a custom policy, switch to:
            #   --policy-file=/config/policy.yaml
            - --policy=slsa-l3
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Liveness probe: uses HTTPS because the server only speaks TLS.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          # Readiness probe: pod is ready once the TLS listener is up.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
