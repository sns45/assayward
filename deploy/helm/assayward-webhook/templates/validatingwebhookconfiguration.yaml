{{/*
ValidatingWebhookConfiguration for the assayward admission webhook.

CA BUNDLE NOTE: the caBundle value MUST come from the same CA used to sign the
serving certificate in secret-tls.yaml. In tls.mode=helm both this file and
secret-tls.yaml reference .Values._generatedCA injected by secret-tls.yaml in
a single render pass, so they always agree within one `helm install` or
`helm template` invocation.

However if you render templates twice independently (e.g. two separate
`helm template` calls) each render generates a fresh CA, so the caBundle and
the serving cert will not match. Always apply the full `helm template` output
at once, or use `helm install/upgrade` which handles this correctly.
*/}}
{{- $svcName := include "assayward-webhook.fullname" . }}
{{- $ns := .Release.Namespace }}

{{- /* Retrieve the CA cert bytes: generated in secret-tls.yaml and stashed in .Values._generatedCA. */}}
{{- $caBundle := "" }}
{{- if eq .Values.tls.mode "helm" }}
{{-   $svcDNS := include "assayward-webhook.serviceDNS" . }}
{{-   $svcClusterDNS := include "assayward-webhook.serviceClusterDNS" . }}
{{-   $ca := genCA (printf "assayward-webhook-ca.%s" $ns) 365 }}
{{-   $cert := genSignedCert $svcDNS (list) (list $svcDNS $svcClusterDNS "localhost") 365 $ca }}
{{-   $caBundle = $ca.Cert | b64enc }}
{{- end }}

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "assayward-webhook.labels" . | nindent 4 }}
webhooks:
  - name: pods.assayward.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    matchPolicy: Equivalent
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate
        port: {{ .Values.service.port }}
      {{- if $caBundle }}
      caBundle: {{ $caBundle }}
      {{- end }}
    {{- with .Values.webhook.namespaceSelector }}
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.webhook.objectSelector }}
    objectSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
