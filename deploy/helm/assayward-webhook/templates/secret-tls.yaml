{{/*
TLS Secret — generated by Helm's genCA + genSignedCert helpers.

IMPORTANT CAVEAT: Helm's genCA/genSignedCert generate a new CA and leaf cert
on EVERY render (helm template / helm install / helm upgrade). This means:

  - helm install / helm upgrade: certs are generated once per operation and
    stored in the cluster Secret + ValidatingWebhookConfiguration. Subsequent
    helm upgrades will regenerate certs (causing a brief re-handshake), unless
    you pin them with --set tls.cert=... --set tls.key=... or use cert-manager.

  - helm template | kubectl apply: the caBundle in the ValidatingWebhookConfiguration
    and the cert in the Secret come from THE SAME render invocation and therefore
    always match. Do NOT render separately and apply piecemeal.

For production workloads consider tls.mode=certManager (cert-manager Certificate)
or generating a cert once and providing it via --set / sealed secrets.
*/}}
{{- if eq .Values.tls.mode "helm" }}
{{- $svcName := include "assayward-webhook.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $svcDNS := include "assayward-webhook.serviceDNS" . }}
{{- $svcClusterDNS := include "assayward-webhook.serviceClusterDNS" . }}
{{- $ca := genCA (printf "assayward-webhook-ca.%s" $ns) 365 }}
{{- $cert := genSignedCert $svcDNS (list) (list $svcDNS $svcClusterDNS "localhost") 365 $ca }}
{{- $_ := set . "Values" (merge .Values (dict "_generatedCA" $ca "_generatedCert" $cert)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "assayward-webhook.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "assayward-webhook.labels" . | nindent 4 }}
  annotations:
    helm.sh/note: >
      Self-signed cert generated by Helm. Rotates on every helm upgrade.
      For stable certs use tls.mode=certManager or supply cert/key via --set.
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- else if eq .Values.tls.mode "certManager" }}
{{- /* cert-manager Certificate emits its own Secret; we do not create a raw Secret. */}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "assayward-webhook.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "assayward-webhook.labels" . | nindent 4 }}
spec:
  secretName: {{ include "assayward-webhook.tlsSecretName" . }}
  duration: {{ .Values.tls.duration }}
  renewBefore: 720h
  dnsNames:
    - {{ include "assayward-webhook.serviceDNS" . }}
    - {{ include "assayward-webhook.serviceClusterDNS" . }}
  issuerRef:
    {{- toYaml .Values.tls.certManager.issuerRef | nindent 4 }}
{{- end }}
