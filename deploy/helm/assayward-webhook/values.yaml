# assayward-webhook Helm values
# ---------------------------------------------------------------------------
# AUDIT-FIRST ROLLOUT (§3): the webhook ships in audit mode with
# failurePolicy=Ignore. Operators watch `kubectl get events` and
# `kubectl describe pod` Warning messages before flipping to enforce.
# ---------------------------------------------------------------------------

replicaCount: 2

image:
  repository: ghcr.io/sns45/assayward-webhook
  # tag defaults to .Chart.AppVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---------------------------------------------------------------------------
# Webhook admission mode
# ---------------------------------------------------------------------------
# audit   — always admits; deny-signals appear as Kubernetes Warnings (§3 default).
# warn    — same as audit.
# enforce — denies admission when any image fails policy (flip after audit phase).
mode: audit

# ---------------------------------------------------------------------------
# Policy selection
# ---------------------------------------------------------------------------
# Choose one of:
#   policy.builtin  — one of: baseline | slsa-l3 | serverless-edge
#   policy.inline   — a full TrustPolicy YAML string; takes precedence when set.
#
# When policy.inline is set the chart mounts it as a file and passes
# --policy-file; otherwise it passes --policy <builtin>.
policy:
  builtin: slsa-l3
  inline: ""

# ---------------------------------------------------------------------------
# Failure policy
# ---------------------------------------------------------------------------
# Ignore — webhook down does not block pod scheduling (safe during rollout).
# Fail   — webhook down blocks pod scheduling (set alongside mode=enforce).
failurePolicy: Ignore

# ---------------------------------------------------------------------------
# Trust roots  (Decision 4: identity is optional in reduced mode)
# ---------------------------------------------------------------------------
trustRoots:
  # Path to a Sigstore TUF trusted-root JSON; mounted as a file if set.
  sigstoreTUF: ""
  # Map of trustDomain -> PEM/JWKS bundle string; each is mounted as a file.
  # Example:
  #   spiffeBundles:
  #     example.org: |
  #       -----BEGIN CERTIFICATE-----
  #       ...
  #       -----END CERTIFICATE-----
  spiffeBundles: {}

# ---------------------------------------------------------------------------
# Webhook selector settings
# ---------------------------------------------------------------------------
webhook:
  # namespaceSelector: exclude kube-system and the release namespace to avoid
  # bootstrap deadlocks and self-deny scenarios.
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
  objectSelector: {}
  timeoutSeconds: 10

# ---------------------------------------------------------------------------
# TLS configuration
# ---------------------------------------------------------------------------
# tls.mode: helm       — self-signed CA + cert generated by Helm (genCA/genSignedCert).
#                        NOTE: helm template regenerates certs on each render; use
#                        helm install / helm upgrade (not raw template output) or
#                        provide --set tls.cert/tls.key for stable certs.
# tls.mode: certManager — emits a cert-manager Certificate resource instead.
tls:
  mode: helm
  # For certManager mode:
  certManager:
    issuerRef:
      name: selfsigned-issuer
      kind: ClusterIssuer
  # Duration for the self-signed cert (helm mode only).
  duration: 8760h  # 1 year

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 443
  targetPort: 8443

# ---------------------------------------------------------------------------
# Resources and security
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

nodeSelector: {}
tolerations: []
affinity: {}
