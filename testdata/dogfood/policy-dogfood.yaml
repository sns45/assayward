apiVersion: assayward.dev/v1alpha1
kind: TrustPolicy
metadata:
  name: forgeseal-dogfood
  version: v0.1.0
spec:
  mode: enforce
  signature:
    # Signature is now verified via forgeseal's keyed CA (offline, stdlib crypto).
    # The leaf cert (SAN: https://forgeseal.dev/cli) chains to the self-signed CA
    # at testdata/dogfood/forgeseal/forgeseal-signing-ca.crt, injected into
    # TrustRoots.SignatureCAs. ECDSA DSSE verification runs in both native and
    # WASM builds without sigstore-go.
    #
    # Keyless Fulcio/Rekor is the future CI path (tracked gap: once forgeseal
    # integrates a real Fulcio CA and Rekor instance, SigstoreTUF will be used).
    required: true
    keyless:
      issuer: ""
      identityPattern: "https://forgeseal.dev/*"
    rekor:
      required: false
  slsa:
    minLevel: 3
    allowedBuilders:
      - "https://forgeseal.dev/*"
  vex:
    maxUnmitigatedSeverity: high
  sbom:
    required: true
  identity:
    required: true
    trustDomain: "spiffe://ci.svidmint.dev"
    idPattern: "spiffe://ci.svidmint.dev/github-actions/*"
